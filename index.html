<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Wu-tang</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <h1>Wu-Tang Name Generator</h1>
    </header>
    <main>
      <label for="input-1">First Name</label>
      <input type="text" id="input-1" />
      <label for="input-2">Last Name</label>
      <input type="text" id="input-2" />
      <label for="input-3">Introvert Or Extrovert</label>
      <input type="text" id="input-3" />
      <label for="colors">What's your favorite color?</label>
      <select name="colors" id="colors">
        <option value="selection">Choose a color</option>
        <option value="Crimson">Crimson</option>
        <option value="Indigo">Indigo</option>
        <option value="Emerald">Emerald</option>
        <option value="Vermilion">Vermillion</option>
        <option value="Magenta">Magenta</option>
        <option value="Cobalt">Cobalt</option>
        <option value="Grey">Grey</option>
        <option value="Gold">Gold</option>
        <option value="Onyx">Onyx</option>
        <option value="Charcoal">Charcoal</option>
      </select>
      <label for="input-5">What state do you live in?</label>
      <input type="text" id="input-5" />

      <button type="button">Generate</button>

      <span id="colors"></span><span></span><span></span><span></span>
    </main>
    <script type="text/javascript" src="/js/main.js"></script>
  </body>
</html>
